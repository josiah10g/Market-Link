<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketLink — Multi-Vendor Commerce Platform</title>
    <meta name="description" content="Discover verified food, fashion, beauty, and tech merchants in Abuja with real-time order tracking and secure payments." />
    <meta name="theme-color" content="#0B0F0E" />

    <!-- OpenGraph & Twitter Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MarketLink — Multi-Vendor Commerce Platform" />
    <meta property="og:description" content="Discover verified food, fashion, beauty, and tech merchants in Abuja with real-time order tracking." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Paystack Inline Popup SDK (deferred to eliminate render-blocking) -->
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
